[package]
name = "zest-core"
description = "Headless terminal emulation: VT parsing, grid, scrollback. No UI, no OS process APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# INVARIANT: this crate must never depend on wgpu, winit, windows, or tokio.
# It must build for wasm32-unknown-unknown with --no-default-features.
# Enforced by `cargo xtask check-deps` in CI.
[dependencies]
vte.workspace = true
unicode-width.workspace = true
bitflags.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, optional = true }

ts-rs = { workspace = true, optional = true }

[features]
default = ["std"]
std = []
# Enables serialization of grid snapshots and deltas -- required by the M3
# daemon and the web/mobile clients, not by the native app.
serde = ["dep:serde", "bitflags/serde"]
# TypeScript bindings for the types `zest-proto` puts on the wire as-is
# (today: `Color`). Off by default and never on in a shipping build, same as
# `zest-proto`'s `ts` feature, which is what turns this on. The wasm32 gate
# builds with --no-default-features, so ts-rs never reaches that target.
ts = ["dep:ts-rs"]

[dev-dependencies]
insta.workspace = true
