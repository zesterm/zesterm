[package]
name = "xtask"
description = "Repo automation: boundary checks, conformance runners, corpus tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zest-config = { workspace = true }
# `export-web` writes the built-in themes out as TypeScript, so the browser
# stops carrying a hand-copied transcription of them.
zest-theme = { workspace = true }
# The settings walk and the theme records are serialized here rather than by
# an example binary: xtask can already link both crates, and shelling out to
# `cargo run` would add ~500ms of workspace resolution to a gate that CI runs
# on every push.
serde_json = { workspace = true }
