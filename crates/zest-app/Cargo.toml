[package]
name = "zest-app"
description = "The zesterm application: window, chrome, motion, and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zesterm"
path = "src/main.rs"

[dependencies]
zest-core.workspace = true
zest-pty.workspace = true
zest-theme.workspace = true
zest-font.workspace = true
zest-render-wgpu.workspace = true
zest-config.workspace = true
zest-input.workspace = true
# The app is a client of its own daemon (ADR-007), so it speaks the same
# protocol the phone does and starts the same binary the fleet runs.
zest-proto.workspace = true
zest-daemon.workspace = true
# The client half of the pairing handshake: this app proves a key like any
# other client, over the same wire the phone will use.
zest-mesh.workspace = true
thiserror = { workspace = true }
# The remembered tab set (tabs_state.rs): plain JSON in the state dir.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
winit.workspace = true
wgpu.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
arboard.workspace = true
# `--screenshot` writes a PNG. Already compiled into this binary via arboard's
# clipboard-image support, so naming it here costs nothing new.
image.workspace = true
raw-window-handle.workspace = true
directories.workspace = true
pollster = "0.4"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# `setsid` for the spawned daemon, so it outlives the window that started it.
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reaching NSWindow for the traffic-light inset. The cluster's extent is not a
# constant -- it moves with localization and OS version -- so the tab strip
# asks AppKit rather than guessing (ROADMAP, WS-C2).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    "NSView",
    "NSButton",
    "NSControl",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
