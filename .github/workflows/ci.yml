# The gates, on every platform the project claims to support.
#
# This did not exist until a macOS contributor pointed out that README.md and
# CLAUDE.md both said "CI runs it" while there was no `.github/` directory at
# all. Two real bugs shipped through that gap: `zest-pty` stayed Windows-only
# longer than anyone noticed, and `zest-core` stopped building for wasm32
# because a new module was missing its `use alloc::…` lines — invisible under
# the default `std` feature, which is the only way anyone was building it.
#
# A gate nobody runs is a comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures here and only here: a warning in an editor is a note,
  # a warning in CI that nobody fails on is noise that trains people to ignore
  # the output.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    # Windows is the primary platform, macOS and Linux are hosts in the fleet,
    # so all three run the full suite rather than one running it and the others
    # merely compiling.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Linux needs the windowing and font libraries winit and fontique link
      # against; without these the failure is a linker error that reads like a
      # code problem.
      #
      # And it needs actual *fonts*. `zest-font`'s fallback tests ask the system
      # for a glyph and assert one comes back, because the alternative — tofu on
      # someone's screen — is not something a mock can catch. A bare runner has
      # no CJK face at all, so `fallback_covers_other_scripts` failed on `世` and
      # read as a fallback bug rather than a missing font. Emoji and the Latin
      # scripts happen to be on the image today; naming them here means a change
      # to that image is a decision rather than a surprise red build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The crate-boundary rules. `zest-core` staying free of wgpu/winit/tokio
      # is what lets the app, the daemon and the clients share one terminal
      # implementation instead of three that drift.
      - run: cargo run -p xtask -- check-deps

      # The settings JSON Schema is what the web and phone settings UIs are
      # generated from. A stale one means a setting exists here and nowhere else.
      - run: cargo run -p xtask -- check-schema

      - name: TypeScript bindings match the Rust
        # The web and phone clients decode against these. Regenerated and
        # compared rather than trusted: protocol 2 moved every id from a byte
        # array to a hex string, and without this that lands as a silent
        # regeneration nobody reviews.
        run: cargo run -p xtask -- check-bindings

      - name: Conformance fixtures match the corpus
        # The bindings say what the wire looks like; these say what it means, and
        # they are what the TypeScript decoder is replayed against. A client that
        # decodes into the right shapes and applies them wrongly passes
        # check-bindings and fails here.
        run: cargo run -p xtask -- check-fixtures

      - name: The web client's generated schema, fields and themes match the Rust
        # zest-config says the settings UIs are *generated* from the schema, and
        # zest-theme's builtins used to reach the browser as hand-copied hex
        # with nothing checking the transcription. Drift here means the native
        # window and the browser disagree about what a theme looks like.
        run: cargo run -p xtask -- check-export-web

      # The invariant that broke. `zest-core` and `zest-proto` cross to the
      # clients, so they must build without std and without a platform.
      - name: zest-core builds for wasm32
        run: cargo build -p zest-core --no-default-features --target wasm32-unknown-unknown

  # Separate from `test`, which is a three-OS Rust matrix. The decoder has no
  # platform surface -- no DOM, no filesystem beyond reading the fixtures -- so
  # running it three times would buy nothing, and it needs no Rust toolchain.
  web:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      # Before setup-node, which needs pnpm present to resolve its cache key.
      #
      # `package_json_file` is not optional here. The action reads its version
      # from `packageManager`, and it looks in the *repository root* by default —
      # `defaults.run.working-directory` applies to `run:` steps, not to an
      # action's inputs. The root package.json that exists today is the repo
      # tooling one and does not carry this workspace's pnpm version, so
      # without this the action fails with "No pnpm version is specified" —
      # which reads like a missing field in a file where the field is present.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Where a binding that no longer matches the hand-written wire types
      # fails: `bindings-match.test.ts` is a type-level test, so `tsc` is what
      # evaluates it and `node --test` cannot.
      - run: pnpm -r typecheck

      # The corpus, replayed against the host terminal's own cells.
      - run: pnpm -r test

  # Third project, third lockfile — see cloud/README.md for why it is not part
  # of the clients/web workspace. Ubuntu only: a Worker's runtime is workerd,
  # so a three-OS matrix would prove nothing the one run does not.
  cloud:
    name: cloud workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      # Same `package_json_file` trap the web job documents above: the action
      # reads `packageManager` from the repository root by default, and
      # `defaults.run.working-directory` does not apply to an action's inputs.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cloud/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      # The routing is a pure function over Request, so this needs no workerd.
      - run: pnpm -r test

      # The Worker serves this directory, so `--dry-run` cannot validate the
      # config without it. Building here also proves the two trees still agree:
      # cloud/ names a path into clients/web, and a path is the one kind of
      # dependency no type checker follows.
      - name: Build the web client the Worker serves
        working-directory: clients/web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @zesterm/app build

      # Bundles and validates wrangler.jsonc with no credentials and no
      # network. It is what catches a binding whose class is never exported, a
      # renamed entrypoint, or a Durable Object with no migration — all of
      # which are otherwise only wrong at deploy time, which is the worst
      # possible moment to find out.
      #
      # What it does *not* do is start anything, which is what the step below
      # is for.
      - run: pnpm -r dry-run

      # ...and this one starts each Worker under a real workerd and makes one
      # request. `--dry-run` above validates the *shape* of a deployment; only
      # this notices a script that cannot boot at all — which is what
      # `packages/relay/src/index.ts` could not do for nineteen merged PRs,
      # every one of them green here. → #113.
      #
      # In the same job on purpose rather than a new one: a new check-run name
      # would have to be added to main's branch-protection list as a follow-up
      # commit after it first reports (AGENTS.md says why), and `cloud workers`
      # already runs everything in this project. It also needs the app's dist/
      # that the step above built, and no credentials or network of its own.
      # Both Workers together take six to eight seconds locally, nearly all of
      # it loading wrangler rather than running workerd.
      - run: pnpm -r boot
