[package]
name = "zest-render-wgpu"
description = "GPU renderer: glyph atlas, SDF rect / glyph / decoration pipelines. No winit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
zest-core.workspace = true
zest-theme.workspace = true
zest-font.workspace = true
unicode-width.workspace = true
rustc-hash.workspace = true
wgpu.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true
etagere.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

# `gles` is not decoration beside `vulkan`: `init_gpu`'s ladder here is
# `[VULKAN, GL]`, and a rung whose backend was never compiled in enumerates
# zero adapters however many drivers the box has. Without it, a machine with a
# working GL driver and no Vulkan ICD panics at the `expect` where the ladder
# was written to degrade, and `ZESTERM_BACKEND=gl` can only ever panic.
# Windows already carries both of its rungs; this was the one platform that
# advertised a fallback it could not reach.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

# The spike that decides whether every shader in this crate premultiplies.
# Kept as an example rather than a test: it needs a real window and a real
# adapter, and its output is a decision, not an assertion.
[[example]]
name = "alpha_probe"
path = "examples/alpha_probe.rs"

[[example]]
name = "render_dump"
path = "examples/render_dump.rs"

[dev-dependencies]
winit.workspace = true
pollster = "0.4"
image.workspace = true
zest-theme.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
