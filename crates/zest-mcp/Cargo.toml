[package]
name = "zest-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "An MCP server that is a client of the zesterm daemon"

[dependencies]
# The wire types, and `Applier` -- the client-side state machine that turns
# keyframes and deltas into a grid.
zest-proto.workspace = true
# A real replica terminal per attached session, so what an agent reads is the
# conformance-tested grid rather than a second implementation of one. This is
# the reason the crate is Rust.
zest-core.workspace = true
thiserror = { workspace = true }
# The blessed client, not a tenth hand-rolled handshake -- `client.rs`'s own doc
# is the argument: a peer that gets the seal switch wrong authenticates fine and
# then cannot be read. Brings `find_or_spawn` for the local daemon too.
zest-daemon.workspace = true
# The agent's own device key, and the sealer/opener the split connection needs.
zest-mesh.workspace = true
# The writer thread is fed by a channel rather than sharing the sealer behind a
# mutex; see `conn.rs`.
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
# The tool surface is JSON in and JSON out; the transport that carries it is one
# module away and adds nothing to the shapes.
serde = { workspace = true }
serde_json = { workspace = true }

# Deliberately not here yet: the MCP/async stack. It arrives with the transport
# that uses it, so `cargo tree` keeps describing what this crate actually does.

[dev-dependencies]
# The recorded fixtures are JSON carrying hex wire bytes; the replay test reads
# them the way any second implementation would.
serde_json = { workspace = true }
# `tests/live.rs` drives `serve()` in-process, so there is no binary to find and
# no socket path to collide on.
zest-daemon = { workspace = true }
