[package]
name = "zest-daemon"
description = "Owns the PTYs on a machine and serves them to attached clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zest-daemon"
path = "src/main.rs"

[dependencies]
zest-core.workspace = true
zest-pty.workspace = true
zest-proto.workspace = true
zest-mesh.workspace = true
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `flock` on the socket path, so two daemons starting at once cannot each
# unlink the other's socket and serve half the clients. Already in the tree via
# zest-pty, so this costs no build time.
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
] }
