[package]
name = "zest-daemon"
description = "Owns the PTYs on a machine and serves them to attached clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zest-daemon"
path = "src/main.rs"

[dependencies]
# Bundled, not the system library. Three operating systems and a CI matrix mean
# "whatever sqlite the host happens to have" is three different versions and one
# of them missing; the build cost is paid once per toolchain and buys the same
# database everywhere.
rusqlite = { version = "0.32", features = ["bundled"] }
zest-core.workspace = true
zest-pty.workspace = true
zest-proto.workspace = true
zest-mesh.workspace = true
# This machine's own profiles, so it can publish them (#262). The daemon
# deliberately had no settings reader until now — `DaemonConfig::shell_integration`
# records the trade as "neither is worth doing before someone needs the switch" —
# and a machine that cannot read its own profiles cannot offer them to a launcher
# on another machine. `check-deps` guards `zest-core`, not this crate, so the
# wasm fence is untouched.
zest-config.workspace = true
# The workspace's one owner of TLS and HTTP, and the first crate to depend on
# it — `--enroll` posts through it. rustls therefore reaches this binary and,
# through it, `zest-app`, which is what #68's boundary says should happen: TLS
# has one owner, and the crates that cross to wasm and to the browser have none.
#
# Note which half of that `check-deps` holds. This crate carries no boundary of
# its own, so nothing would stop a second HTTP client being added to this very
# table; what the check enforces is that the portable crates never gain one.
# The rule here is read, not enforced: anything needing TLS goes into
# `zest-cloud` and comes back through this line.
zest-cloud.workspace = true
serde = { workspace = true }
# Enrolment only. The daemon's own wire is MessagePack; the control plane is a
# Worker, and JSON is what it speaks -- so this is the boundary's format rather
# than a second protocol creeping in. Already in the tree via zest-config.
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Where the trust file lives, matching zest-config's directories.
directories = { workspace = true }
# A signal runs no destructors, so the mDNS goodbye that `Drop` sends never
# goes out for a pkill or a Ctrl+C, and the dead daemon stays on every fleet
# listing for the record's TTL (#22). `ctrlc` runs its handler on a thread of
# its own, which is what lets the handler do non-signal-safe work like waiting
# for the goodbye to actually leave.
ctrlc = { version = "3.5", features = ["termination"] }
# The Sec-WebSocket-Accept digest and nothing else. A protocol checksum, not a
# security boundary; the hashes that matter are SHA-256 in zest-mesh.
sha1 = "0.10"
# The editor's save check (#446): a file's content hash, so a save that would
# clobber a change made underneath is refused instead. Already in the tree via
# zest-mesh, at the same version, so this costs no build time.
sha2 = "0.10"

[dev-dependencies]
# The end-to-end WebSocket tests drive our hand-rolled server with an
# independent implementation, so the server is proven against the RFC rather
# than against a mirror of itself. Never a runtime dependency: ws.rs explains
# why sync tungstenite cannot serve `serve`'s split read/write halves.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
# `flock` on the socket path, so two daemons starting at once cannot each
# unlink the other's socket and serve half the clients. Already in the tree via
# zest-pty, so this costs no build time.
# `system` is for uname(), which is how a machine learns its own name --
# `HOSTNAME` is a *shell* variable and is not in a daemon's environment.
rustix = { workspace = true, features = ["fs", "process", "system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    # GetComputerNameExW: a machine has to be able to name itself without help
    # from the environment, on every platform. See `machine_label`.
    "Win32_System_SystemInformation",
] }
