document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rap;align-items:flex-start;gap:14px 20px;padding:16px 2px\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.title.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Tab title<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Programs set titles with OSC 0. Locking it to the profile name ignores them.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">tab_title<\u002Fspan>\n                      <span style=\"{{ pv.title.chipStyle }}\">{{ pv.title.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                  <div style=\"display:flex;gap:3px;padding:3px;border-radius:9px;background:#121829;border:1px solid #2a3350\">\n                    <sc-for list=\"{{ pv.title.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;gap:10px;padding:22px 2px 4px\">\n                <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8b93a7\">Appearance<\u002Fspan>\n                <div style=\"flex:1;height:1px;background:#1b2338\"><\u002Fdiv>\n                <span style=\"font-size:10.5px;color:#4a516a\">Unset rows fall through to Defaults<\u002Fspan>\n }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"{{ o.labelStyle }}\">{{ o.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.font.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Font<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">A remote profile can want a different face — the host's glyph coverage is not this machine's.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">typography.families · size_pt<\u002Fspan>\n                      <span style=\"{{ pv.font.chipStyle }}\">{{ pv.font.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;gap:6px;justify-content:flex-end\">\n                  <div style=\"flex:1;min-width:0;height:32px;padding:0 11px;border-radius:8px;background:#121829;border:1px solid #2a3350;display:flex;align-items:center;gap:8px;cursor:pointer\" style-hover=\"border-color:#6ea8ff\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#d7dcea;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pv.fontName }}<\u002Fspan>\n                    <span style=\"color:#4a516a;font-size:10px\">▾<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;height:32px;border:1px solid #2a3350;border-radius:8px;overflow:hidden;background:#121829;flex:none\">\n                    <div sc-camel-on-click=\"{{ pv.size.dec }}\" style=\"width:26px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:13px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">−<\u002Fdiv>\n                    <div style=\"min-width:52px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#d7dcea\">{{ pv.size.label }}<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ pv.size.inc }}\" style=\"width:26px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:13px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">＋<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.opacity.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Opacity and backdrop<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">The backdrop is the compositor's, so it is the local window's material — not the host's.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">window.opacity · backdrop<\u002Fspan>\n                      <span style=\"{{ pv.opacity.chipStyle }}\">{{ pv.opacity.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end\">\n                  <div style=\"display:flex;align-items:center;gap:12px\">\n                    <div sc-camel-on-mouse-down=\"{{ pv.opacity.onDown }}\" style=\"width:150px;height:4px;border-radius:2px;background:#2a3350;position:relative;cursor:pointer\">\n                      <div style=\"{{ pv.opacity.fill }}\"><\u002Fdiv>\n                      <div style=\"{{ pv.opacity.knobPos }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#d7dcea;min-width:44px;text-align:right\">{{ pv.opacity.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:3px;padding:3px;border-radius:9px;background:#121829;border:1px solid #2a3350\">\n                    <sc-for list=\"{{ pv.backdrop.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.bg.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Background image<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Drawn behind the cells at the dimming below. A watermark in the corner reads better than a full-bleed photo behind text.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">background_image<\u002Fspan>\n                      <span style=\"{{ pv.bg.chipStyle }}\">{{ pv.bg.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"width:100%;height:96px;border-radius:9px;overflow:hidden;border:1px solid #2a3350;position:relative\">\n                    <image-slot id=\"profile-bg\" shape=\"rect\" placeholder=\"Drop a background\"><\u002Fimage-slot>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:3px;padding:3px;border-radius:9px;background:#121829;border:1px solid #2a3350;align-self:flex-end\">\n                    <sc-for list=\"{{ pv.bgFit.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:12px;align-self:flex-end\">\n                    <span style=\"font-size:11px;color:#8b93a7\">Dim<\u002Fspan>\n                    <div sc-camel-on-mouse-down=\"{{ pv.bgDim.onDown }}\" style=\"width:120px;height:4px;border-radius:2px;background:#2a3350;position:relative;cursor:pointer\">\n                      <div style=\"{{ pv.bgDim.fill }}\"><\u002Fdiv>\n                      <div style=\"{{ pv.bgDim.knobPos }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#d7dcea;min-width:44px;text-align:right\">{{ pv.bgDim.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.color.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Tab colour and icon<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">How this profile is recognised in the strip, the sidebar, the palette and the phone. Colour it by the profile, or by the host it runs on — set that on Defaults and the whole fleet reads by machine.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">tab_color · icon<\u002Fspan>\n                      <span style=\"{{ pv.color.chipStyle }}\">{{ pv.color.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end\">\n                  <div style=\"display:flex;gap:3px;padding:3px;border-radius:9px;background:#121829;border:1px solid #2a3350\">\n                    <sc-for list=\"{{ pv.colorFrom.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"{{ pv.colorFrom.swatchRow }}\">\n                    <sc-for list=\"{{ pv.color.opts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:5px\">\n                    <sc-for list=\"{{ pv.icon.opts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;gap:10px;padding:22px 2px 4px\">\n                <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8b93a7\">Cursor<\u002Fspan>\n                <div style=\"flex:1;height:1px;background:#1b2338\"><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.cursor.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Shape<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Unless the program sets one with DECSCUSR.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">cursor.shape<\u002Fspan>\n                      <span style=\"{{ pv.cursor.chipStyle }}\">{{ pv.cursor.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                  <div style=\"display:flex;gap:3px;padding:3px;border-radius:9px;background:#121829;border:1px solid #2a3350\">\n                    <sc-for list=\"{{ pv.cursor.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ o.onSelect }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px\">\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                  <div style=\"{{ pv.blink.dot }}\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px\">\n                    <div style=\"font-size:13px;color:#d7dcea\">Blink<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Stops on focus loss and wakes on a timer, never spins.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">cursor.blink<\u002Fspan>\n                      <span style=\"{{ pv.blink.chipStyle }}\">{{ pv.blink.chip }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 1 300px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                  <div sc-camel-on-click=\"{{ pv.blink.toggle }}\" style=\"{{ pv.blink.track }}\"><div style=\"{{ pv.blink.knob }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:none;height:42px;display:flex;align-items:center;gap:12px;padding:0 30px;border-top:1px solid #1b2338;background:#0f1526\">\n              <div style=\"{{ pv.footDotStyle }}\"><\u002Fdiv>\n              <span style=\"font-size:11px;color:#8b93a7\">{{ pv.footNote }}<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">{{ pv.footKey }}<\u002Fspan>\n              <span style=\"font-size:11.5px;color:#8b93a7;cursor:pointer\" style-hover=\"color:#d7dcea\">Edit as TOML<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;min-height:0;background:#0b0f1a\">\n\n          <div style=\"width:214px;flex:none;min-height:0;background:#0f1526;border-right:1px solid #1b2338;display:flex;flex-direction:column\">\n            <div style=\"padding:12px 10px 10px\">\n              <div style=\"display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;border-radius:7px;background:#121829;border:1px solid #2a3350;font-size:12px;color:#4a516a\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">/<\u002Fspan>\n                <span>Filter settings<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:1px\">\n              <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"9\">\n                <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"{{ c.style }}\">\n                  <span style=\"flex:1;min-width:0\">{{ c.label }}<\u002Fspan>\n                  <span style=\"{{ c.countStyle }}\">{{ c.count }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex:none;padding:12px 14px;border-top:1px solid #1b2338;font-size:10.5px;color:#4a516a;line-height:1.55\">\n              Every field is generated from the config schema — a new setting appears here with no UI change.\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-width:0;min-height:0;display:flex;flex-direction:column\">\n            <div style=\"flex:none;padding:22px 30px 16px;border-bottom:1px solid #1b2338\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <h3 style=\"margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em\">{{ catLabel }}<\u002Fh3>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">{{ catKey }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:6px 0 0;font-size:12px;color:#8b93a7;line-height:1.55;max-width:520px;text-wrap:pretty\">{{ catLede }}<\u002Fp>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ needsRestart }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"flex:none;margin:14px 30px 0;padding:10px 13px;border-radius:9px;background:rgba(224,179,65,.1);border:1px solid rgba(224,179,65,.35);display:flex;align-items:center;gap:10px\">\n                <div style=\"width:5px;height:5px;border-radius:50%;background:#e0b341;flex:none\"><\u002Fdiv>\n                <span style=\"font-size:12px;color:#e0b341;flex:1\">Saved. Titlebar ownership applies on the next launch.<\u002Fspan>\n                <span style=\"font-size:11.5px;color:#8b93a7;cursor:pointer\" style-hover=\"color:#d7dcea\">Relaunch now<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 30px 30px\">\n\n              <sc-if value=\"{{ catText }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.typography_families.onReset }}\" style=\"{{ w.typography_families.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Font families<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Preference order — the first family with a glyph wins.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">typography.families<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;flex-direction:column;gap:4px\">\n                    <div style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;background:#121829;border:1px solid #2a3350\">\n                      <span style=\"color:#4a516a;font-size:11px;cursor:grab\">⠿<\u002Fspan>\n                      <span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#d7dcea\">Cascadia Mono<\u002Fspan>\n                      <span style=\"font-size:11px;color:#4a516a;cursor:pointer\" style-hover=\"color:#e0606a\">×<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;background:#121829;border:1px solid #2a3350\">\n                      <span style=\"color:#4a516a;font-size:11px;cursor:grab\">⠿<\u002Fspan>\n                      <span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#d7dcea\">JetBrainsMono Nerd Font<\u002Fspan>\n                      <span style=\"font-size:11px;color:#4a516a;cursor:pointer\" style-hover=\"color:#e0606a\">×<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;background:#0f1526;border:1px solid #1b2338\">\n                      <span style=\"color:#4a516a;font-size:11px;cursor:grab\">⠿<\u002Fspan>\n                      <span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8b93a7\">Menlo<\u002Fspan>\n                      <span style=\"font-size:10px;color:#4a516a\">fallback<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height:30px;border-radius:8px;border:1px dashed #2a3350;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#8b93a7;cursor:pointer\" style-hover=\"border-color:#6ea8ff;color:#d7dcea\">＋ Add a family<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.typography_size_pt.onReset }}\" style=\"{{ w.typography_size_pt.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Size<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Font size in points.<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a\">typography.size_pt<\u002Fspan>\n                        <span style=\"font-size:10px;color:#6ea8ff;padding:1px 6px;border-radius:5px;background:#16203a\">set by config file<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div style=\"display:flex;align-items:center;height:30px;border:1px solid #2a3350;border-radius:8px;overflow:hidden;background:#121829\">\n                      <div sc-camel-on-click=\"{{ w.typography_size_pt.dec }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">−<\u002Fdiv>\n                      <div style=\"min-width:74px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d7dcea\">{{ w.typography_size_pt.label }}<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ w.typography_size_pt.inc }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">＋<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.typography_line_height.onReset }}\" style=\"{{ w.typography_line_height.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Line height<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">A multiple of the font's natural height. Geometry — changing it resizes the pty.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">typography.line_height<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div style=\"display:flex;align-items:center;height:30px;border:1px solid #2a3350;border-radius:8px;overflow:hidden;background:#121829\">\n                      <div sc-camel-on-click=\"{{ w.typography_line_height.dec }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">−<\u002Fdiv>\n                      <div style=\"min-width:74px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d7dcea\">{{ w.typography_line_height.label }}<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ w.typography_line_height.inc }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">＋<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.typography_features.onReset }}\" style=\"{{ w.typography_features.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">OpenType features<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Prefix with <span style=\"font-family:'JetBrains Mono',monospace\">-<\u002Fspan> to disable one.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">typography.features<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end\">\n                    <div style=\"height:26px;padding:0 8px 0 10px;border-radius:7px;background:#16203a;border:1px solid #2a3350;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6ea8ff\">calt<span style=\"color:#4a516a;cursor:pointer\" style-hover=\"color:#e0606a\">×<\u002Fspan><\u002Fdiv>\n                    <div style=\"height:26px;padding:0 8px 0 10px;border-radius:7px;background:#16203a;border:1px solid #2a3350;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6ea8ff\">-liga<span style=\"color:#4a516a;cursor:pointer\" style-hover=\"color:#e0606a\">×<\u002Fspan><\u002Fdiv>\n                    <div style=\"height:26px;padding:0 10px;border-radius:7px;border:1px dashed #2a3350;display:flex;align-items:center;font-size:11.5px;color:#8b93a7;cursor:pointer\" style-hover=\"border-color:#6ea8ff;color:#d7dcea\">＋ tag<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.typography_ligatures.onReset }}\" style=\"{{ w.typography_ligatures.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Programming ligatures<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:# _builtin_box_drawing.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ catAppearance }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.appearance_theme.onReset }}\" style=\"{{ w.appearance_theme.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Theme<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Styles the window — titlebar, tabs, panels, status bar — and supplies the default grid palette. A profile may override the palette; nothing overrides the chrome.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">appearance.theme<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ goThemes }}\" style=\"height:32px;padding:0 10px;border-radius:8px;background:#121829;border:1px solid #2a3350;display:flex;align-items:center;gap:10px;cursor:pointer\" style-hover=\"border-color:#6ea8ff\">\n                      <div style=\"display:flex;height:14px;width:60px;border-radius:3px;overflow:hidden\">\n                        <div style=\"flex:1;background:#0b0f1a\"><\u002Fdiv><div style=\"flex:1;background:#e0606a\"><\u002Fdiv><div style=\"flex:1;background:#5fd17f\"><\u002Fdiv><div style=\"flex:1;background:#6ea8ff\"><\u002Fdiv><div style=\"flex:1;background:#b07cff\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-size:12.5px;color:#d7dcea;flex:1\">obsidian<\u002Fspan>\n                      <span style=\"color:#4a516a;font-size:10px\">▾<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.appearance_light_theme.onReset }}\" style=\"{{ w.appearance_light_theme.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Light theme<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Used when the OS reports a light appearance. Unset means follow the theme above regardless.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">appearance.light_theme<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ goThemes }}\" style=\"height:32px;padding:0 10px;border-radius:8px;background:#121829;border:1px dashed #2a3350;display:flex;align-items:center;gap:10px;cursor:pointer\" style-hover=\"border-color:#6ea8ff\">\n                      <span style=\"font-size:12.5px;color:#4a516a;flex:1\">not set<\u002Fspan>\n                      <span style=\"color:#4a516a;font-size:10px\">▾<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.appearance_follow_system_theme.onReset }}\" style=\"{{ w.appearance_follow_system_theme.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Follow system appearance<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Switch between the two themes above with the OS.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">appearance.follow_system_theme<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ w.appearance_follow_system_theme.toggle }}\" style=\"{{ w.appearance_follow_system_theme.track }}\"><div style=\"{{ w.appearance_follow_system_theme.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.appearance_text_gamma.onReset }}\" style=\"{{ w.appearance_text_gamma.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Stem darkening<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:42 n:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Reattach tabs on launch<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Off, every launch starts with one fresh local shell and existing sessions are reachable through the picker.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">tabs.restore<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ w.tabs_restore.toggle }}\" style=\"{{ w.tabs_restore.track }}\"><div style=\"{{ w.tabs_restore.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ catShell }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.shell_command.onReset }}\" style=\"{{ w.shell_command.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Command<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Empty runs the platform default. This is why a workspace config is never trusted automatically.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">shell.command<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002F space;font-size:11.5px;color:#6ea8ff\">PAGER<\u002Fdiv>\n                      <div style=\"flex:1;height:30px;padding:0 10px;border-radius:0 8px 8px 0;background:#121829;border:1px solid #2a3350;display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#4a516a\">unset<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"height:30px;border-radius:8px;border:1px dashed #2a3350;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#8b93a7;cursor:pointer\" style-hover=\"border-color:#6ea8ff;color:#d7dcea\">＋ Add a variable<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ catScrolling }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.scrolling_scrollback.onReset }}\" style=\"{{ w.scrolling_scrollback.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Scrollback<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Lines of history retained per session.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">scrolling.scrollback<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div style=\"display:flex;align-items:center;height:30px;border:1px solid #2a3350;border-radius:8px;overflow:hidden;background:#121829\">\n olid #2a3350;border-radius:8px;overflow:hidden;background:#121829\">\n                      <div sc-camel-on-click=\"{{ w.scrolling_lines_per_notch.dec }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">−<\u002Fdiv>\n                      <div style=\"min-width:74px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d7dcea\">{{ w.scrolling_lines_per_notch.label }}<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ w.scrolling_lines_per_notch.inc }}\" style=\"width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#8b93a7;cursor:pointer;font-size:14px;user-select:none\" style-hover=\"background:#161d33;color:#d7dcea\">＋<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.scrolling_scroll_on_output.onReset }}\" style=\"{{ w.scrolling_scroll_on_output.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Scroll on output<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Off by default: with it on, scrollback can't be read while anything is running.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">scrolling.scroll_on_output<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ w.scrolling_scroll_on_output.toggle }}\" style=\"{{ w.scrolling_scroll_on_output.track }}\"><div style=\"{{ w.scrolling_scroll_on_output.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.scrolling_scroll_on_keypress.onReset }}\" style=\"{{ w.scrolling_scroll_on_keypress.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Scroll on keypress<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Jump to the bottom when a key is pressed.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">scrolling.scroll_on_keypress<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ w.scrolling_scroll_on_keypress.toggle }}\" style=\"{{ w.scrolling_scroll_on_keypress.track }}\"><div style=\"{{ w.scrolling_scroll_on_keypress.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ catCursor }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;g lumn;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Blink<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px;text-wrap:pretty\">Stops on focus loss and wakes on a timer, never spins — blinking is the usual way a terminal loses its idle claim.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">cursor.blink<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div sc-camel-on-click=\"{{ w.cursor_blink.toggle }}\" style=\"{{ w.cursor_blink.track }}\"><div style=\"{{ w.cursor_blink.knob }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;padding:16px 2px;border-bottom:1px solid #1b2338\">\n                  <div style=\"flex:1 1 260px;min-width:0;display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ w.cursor_blink_interval_ms.onReset }}\" style=\"{{ w.cursor_blink_interval_ms.dot }}\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:13px;color:#d7dcea\">Blink interval<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8b93a7;line-height:1.5;max-width:420px\">Half-period, in milliseconds.<\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a516a;padding-top:2px\">cursor.blink_interval_ms<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 1 262px;min-width:0;margin-left:auto;display:flex;justify-content:flex-end\">\n                    <div style=\"display:flex;ali
