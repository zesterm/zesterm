[workspace]
resolver = "2"
# Most of the crates the project will have are registered here up front,
# including the ones that are still skeletons.
#
# The original reason was parallel workstreams: each adding a crate would edit
# this list and `Cargo.lock`, the one pair of files guaranteed to conflict
# between them. Work now lands one lane at a time, so that has expired — a new
# crate is added here by the change that introduces it, and the skeletons below
# stay because deleting a registration to re-add it later is churn, not tidying.
members = [
    "crates/zest-core",
    "crates/zest-pty",
    "crates/zest-theme",
    "crates/zest-font",
    "crates/zest-render-wgpu",
    "crates/zest-input",
    "crates/zest-config",
    "crates/zest-proto",
    "crates/zest-mesh",
    "crates/zest-cloud",
    "crates/zest-daemon",
    "crates/zest-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zesterm/zesterm"
authors = ["Andreas Ekdahl <andy@ekdahls.net>"]

[workspace.dependencies]
# --- internal ---
zest-core = { path = "crates/zest-core" }
zest-pty = { path = "crates/zest-pty" }
zest-theme = { path = "crates/zest-theme" }
zest-font = { path = "crates/zest-font" }
zest-render-wgpu = { path = "crates/zest-render-wgpu" }
zest-input = { path = "crates/zest-input" }
zest-config = { path = "crates/zest-config" }
zest-proto = { path = "crates/zest-proto" }
zest-mesh = { path = "crates/zest-mesh" }
zest-cloud = { path = "crates/zest-cloud" }
zest-daemon = { path = "crates/zest-daemon" }

# --- graphics: these three MUST move together. Version skew between wgpu,
#     winit and raw-window-handle is the single most common wgpu papercut. ---
wgpu = { version = "30.0", default-features = false, features = ["wgsl"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"

# --- terminal ---
vte = "0.15"
unicode-width = "0.2"

# --- text ---
swash = "0.2.10"
fontique = "0.11"
etagere = "0.3"

# --- platform ---
windows-sys = "0.60"
rustix = "1.0"
arboard = "3.6"

# --- data / infra ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rustc-hash = "2"
palette = "0.7"
directories = "5"
notify = "6"
schemars = "1"
ts-rs = "10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- dev ---
insta = "1"
criterion = "0.5"
image = "0.25"

# Debug builds of a VT parser at opt-level 0 are unusably slow -- this is not
# optional. Dependencies are always fully optimized; only our own crates are
# built at opt-level 1 so debugging stays reasonable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1          # keep line tables for profiling
# NOTE: deliberately NOT panic = "abort" -- we want unwinding for the
# fuzz harness and for catching parser panics without killing the session.

# For actually running the terminal while working on it.
#
# `release` is tuned for shipping: thin LTO and a single codegen unit make a
# fast binary and a slow build, and rebuilding it to try a one-line change is
# minutes of waiting. This drops both and is within a few percent at runtime --
# fast enough that startup and frame timings measured here are still meaningful.
#
#     cargo run --profile fast -p zest-app
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
