# The gates, on every platform the project claims to support.
#
# This did not exist until a macOS contributor pointed out that README.md and
# CLAUDE.md both said "CI runs it" while there was no `.github/` directory at
# all. Two real bugs shipped through that gap: `zest-pty` stayed Windows-only
# longer than anyone noticed, and `zest-core` stopped building for wasm32
# because a new module was missing its `use alloc::…` lines — invisible under
# the default `std` feature, which is the only way anyone was building it.
#
# A gate nobody runs is a comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures here and only here: a warning in an editor is a note,
  # a warning in CI that nobody fails on is noise that trains people to ignore
  # the output.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    # Windows is the primary platform, macOS and Linux are hosts in the fleet,
    # so all three run the full suite rather than one running it and the others
    # merely compiling.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Linux needs the windowing and font libraries winit and fontique link
      # against; without these the failure is a linker error that reads like a
      # code problem.
      #
      # And it needs actual *fonts*. `zest-font`'s fallback tests ask the system
      # for a glyph and assert one comes back, because the alternative — tofu on
      # someone's screen — is not something a mock can catch. A bare runner has
      # no CJK face at all, so `fallback_covers_other_scripts` failed on `世` and
      # read as a fallback bug rather than a missing font. Emoji and the Latin
      # scripts happen to be on the image today; naming them here means a change
      # to that image is a decision rather than a surprise red build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The crate-boundary rules. `zest-core` staying free of wgpu/winit/tokio
      # is what lets the app, the daemon and the clients share one terminal
      # implementation instead of three that drift.
      - run: cargo run -p xtask -- check-deps

      # The settings JSON Schema is what the web and phone settings UIs are
      # generated from. A stale one means a setting exists here and nowhere else.
      - run: cargo run -p xtask -- check-schema

      - name: TypeScript bindings match the Rust
        # The web and phone clients decode against these. Regenerated and
        # compared rather than trusted: protocol 2 moved every id from a byte
        # array to a hex string, and without this that lands as a silent
        # regeneration nobody reviews.
        run: cargo run -p xtask -- check-bindings

      - name: Conformance fixtures match the corpus
        # The bindings say what the wire looks like; these say what it means, and
        # they are what the TypeScript decoder is replayed against. A client that
        # decodes into the right shapes and applies them wrongly passes
        # check-bindings and fails here.
        run: cargo run -p xtask -- check-fixtures

      # The invariant that broke. `zest-core` and `zest-proto` cross to the
      # clients, so they must build without std and without a platform.
      - name: zest-core builds for wasm32
        run: cargo build -p zest-core --no-default-features --target wasm32-unknown-unknown

  # Separate from `test`, which is a three-OS Rust matrix. The decoder has no
  # platform surface -- no DOM, no filesystem beyond reading the fixtures -- so
  # running it three times would buy nothing, and it needs no Rust toolchain.
  web:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      # Before setup-node, which needs pnpm present to resolve its cache key.
      #
      # `package_json_file` is not optional here. The action reads its version
      # from `packageManager`, and it looks in the *repository root* by default —
      # `defaults.run.working-directory` applies to `run:` steps, not to an
      # action's inputs. There is no root package.json, so it failed with "No
      # pnpm version is specified", which reads like a missing field in a file
      # where the field is in fact present.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Where a binding that no longer matches the hand-written wire types
      # fails: `bindings-match.test.ts` is a type-level test, so `tsc` is what
      # evaluates it and `node --test` cannot.
      - run: pnpm -r typecheck

      # The corpus, replayed against the host terminal's own cells.
      - run: pnpm -r test
